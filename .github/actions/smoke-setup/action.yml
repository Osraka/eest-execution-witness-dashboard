name: Set up a smoke job
description: Install tools, restore dependency caches, and fill the empty-block smoke fixture.

inputs:
  apt-packages:
    description: Extra apt packages to install alongside jq.
    required: false
    default: ""
  save-cache:
    description: Save the Go and Python dependency cache. Set it on one job that uses both.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y jq $APT_PACKAGES
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/setup-go@v6
      with:
        go-version: stable
        cache: false
    - uses: astral-sh/setup-uv@v8.1.0
    - name: Set uv cache directory
      shell: bash
      run: printf 'UV_CACHE_DIR=%s/uv-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    # Only one job saves, so a job without Go cannot store an incomplete cache.
    - name: Cache Go and Python dependencies
      if: inputs.save-cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ${{ runner.temp }}/uv-cache
        key: pr-smoke-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/env.sh') }}
        restore-keys: pr-smoke-deps-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Go and Python dependencies
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ${{ runner.temp }}/uv-cache
        key: pr-smoke-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/env.sh') }}
        restore-keys: pr-smoke-deps-${{ runner.os }}-${{ runner.arch }}-
    - name: Fill empty-block fixture
      shell: bash
      run: scripts/prepare-fixtures.sh
